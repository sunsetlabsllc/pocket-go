<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pocket Go">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b779"/>
      <stop offset="1" stop-color="#b88f4f"/>
    </linearGradient>
    <radialGradient id="black" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4a4239"/>
      <stop offset="1" stop-color="#0a0805"/>
    </radialGradient>
    <radialGradient id="white" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8d2c2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" rx="44" fill="url(#wood)"/>

  <g stroke="#3a2a17" stroke-width="2" stroke-linecap="square">
    <line x1="40" y1="40" x2="160" y2="40"/>
    <line x1="40" y1="80" x2="160" y2="80"/>
    <line x1="40" y1="120" x2="160" y2="120"/>
    <line x1="40" y1="160" x2="160" y2="160"/>
    <line x1="40" y1="40" x2="40" y2="160"/>
    <line x1="80" y1="40" x2="80" y2="160"/>
    <line x1="120" y1="40" x2="120" y2="160"/>
    <line x1="160" y1="40" x2="160" y2="160"/>
  </g>

  <circle cx="80" cy="120" r="18" fill="url(#black)"/>
  <circle cx="120" cy="80" r="18" fill="url(#white)" stroke="#8a7d62" stroke-width="0.5"/>
</svg>
